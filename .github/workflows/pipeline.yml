# Single CI/CD pipeline with one gate, `check` (ADR 0002).
#
# - Every push to a PR runs `check` once; a green `check` deploys a preview.
# - A merge to `main` re-runs `check` on the merged commit; a green `check`
#   deploys production.
# - Dependabot PRs get `check` only: their runs have no secrets.
# - A branch without a PR gets no preview. Open a draft PR, or run this
#   workflow manually (workflow_dispatch) to get one.
name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per PR (or ref) at a time. A new push to a PR cancels the stale
# run; runs on `main` are never cancelled, so every merge reaches production
# in order.
concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    # No secrets here, so `check` also passes on Dependabot-triggered runs.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  preview:
    name: preview
    needs: check
    # PRs and manual runs only, never for Dependabot (its runs have no secrets).
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: pnpm exec vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build project
        run: pnpm exec vercel build --token="$VERCEL_TOKEN"

      - name: Deploy with prebuilt output
        id: deploy
        run: |
          url="$(pnpm exec vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The fixed alias is the only domain authorized for Google sign-in in
      # the dev Firebase project (ADR 0003); raw preview URLs can't sign in.
      - name: Point preview alias at this deploy
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm exec vercel alias set "$DEPLOY_URL" split-expenses-preview.vercel.app --token="$VERCEL_TOKEN"

  production:
    name: production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    # This job has no test steps of its own, on purpose. Its safety comes from
    # `check` (which it needs, re-run on the merged commit) plus the ruleset
    # on `main` (every commit arrives through a PR that passed `check`).
    # Do not remove that protection without bringing back a gate (ADR 0002).
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project
        run: pnpm exec vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy with prebuilt output
        run: pnpm exec vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
